server.port=${SERVER_PORT:8081}

# PostgreSQL - R2DBC (conexiones reactivas)
spring.r2dbc.url=${DATABASE_FINANZAS_MANAGER:r2dbc:postgresql://localhost:5432/finanzas}
spring.r2dbc.username=${DBUSER:postgres}
spring.r2dbc.password=${DBPASSWORD:postgres}

# PostgreSQL - JDBC (solo para Flyway, no se usa en runtime)
spring.flyway.url=${FLYWAY_URL:jdbc:postgresql://localhost:5432/finanzas}
spring.flyway.user=${DBUSER:postgres}
spring.flyway.password=${DBPASSWORD:postgres}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Elasticsearch
spring.elasticsearch.uris=http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}
