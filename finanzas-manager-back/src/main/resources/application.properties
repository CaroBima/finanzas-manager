server.port=${SERVER_PORT:8081}

# PostgreSQL - R2DBC (conexiones reactivas)
spring.r2dbc.url=${DATABASE_FINANZAS_MANAGER:r2dbc:postgresql://localhost:5432/finanzas}
spring.r2dbc.username=${DBUSER:postgres}
spring.r2dbc.password=${DBPASSWORD:postgres}

# PostgreSQL - JDBC (solo para Flyway, no se usa en runtime)
spring.flyway.url=${FLYWAY_URL:jdbc:postgresql://localhost:5432/finanzas}
spring.flyway.user=${DBUSER:postgres}
spring.flyway.password=${DBPASSWORD:postgres}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Elasticsearch
spring.elasticsearch.uris=http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}

# Keycloak — OAuth2 Client (flujo de login)
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:finanzas-manager-back}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri=${KEYCLOAK_REDIRECT_BASE_URL:http://localhost:8081}/login/oauth2/code/keycloak
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/finanzas}
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_EXTERNAL_AUTH_URI:http://localhost:8080/realms/finanzas/protocol/openid-connect/auth}

# Keycloak — Resource Server (validación de tokens entrantes)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/finanzas}

# Frontend
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
