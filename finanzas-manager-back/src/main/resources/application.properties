server.port=${SERVER_PORT:8081}

spring.r2dbc.url=${DATABASE_FINANZAS_MANAGER:r2dbc:postgresql://localhost:5432/finanzas}
spring.r2dbc.username=${DBUSER:postgres}
spring.r2dbc.password=${DBPASSWORD:postgres}

spring.flyway.url=${FLYWAY_URL:jdbc:postgresql://localhost:5432/finanzas}
spring.flyway.user=${DBUSER:postgres}
spring.flyway.password=${DBPASSWORD:postgres}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.elasticsearch.uris=http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}

spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:finanzas-manager-back}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri=${KEYCLOAK_REDIRECT_BASE_URL:http://localhost:8081}/login/oauth2/code/keycloak
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_EXTERNAL_AUTH_URI:http://localhost:8080/realms/finanzas/protocol/openid-connect/auth}
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/finanzas}/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/finanzas}/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-name-attribute=sub

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/finanzas}/protocol/openid-connect/certs

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
